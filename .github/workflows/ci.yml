name: CI Pipeline - Farutech Platform Control Plane

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build Control Plane (.NET 10)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/backend/Farutech.Platform.ControlPlane.csproj

      - name: Build Control Plane
        run: dotnet build src/backend/Farutech.Platform.ControlPlane.csproj --no-restore --configuration Release
